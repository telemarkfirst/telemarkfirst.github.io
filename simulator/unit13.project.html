<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Unit 13 cumulative multi-file robot architecture project with requirements and student feedback" />
  <title>Telemark Unit 13 Build Project</title>
  <script src="./simulator_base.js"></script>
  <script src="./telemark-java.js"></script>
  <script src="./telemark-editor.js"></script>
  <script src="./telemark-project.js"></script>
  <link rel="stylesheet" href="./telemark-project.css" />
  <script src="./gamepad-controls.js"></script>
  <script src="./unit13-project.js"></script>
  <link rel="stylesheet" href="./telemark-sim.css" />
  <style>
    #sim-right-panel #sim-scene-container {
      flex: 1 0 clamp(390px, 58vh, 590px);
      min-height: 390px;
    }

    .u13-project-stage {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 5;
      max-width: calc(100% - 24px);
      padding: 9px 12px;
      border: 1px solid #2f5365;
      border-radius: 9px;
      background: rgba(5, 12, 18, 0.9);
      color: #d9f3ff;
      font: 700 0.78rem/1.35 var(--font-ui, Arial, sans-serif);
      pointer-events: none;
    }

    .u13-project-stage small {
      display: block;
      margin-top: 3px;
      color: #96a9b5;
      font-weight: 500;
    }

    .u13-project-flow {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 10px;
      border: 1px solid #293945;
      border-radius: 9px;
      background: rgba(5, 8, 12, 0.9);
      color: #aab7c1;
      font: 600 0.72rem/1.3 var(--font-ui, Arial, sans-serif);
      pointer-events: none;
    }

    .u13-project-flow span {
      padding: 4px 7px;
      border: 1px solid #34444f;
      border-radius: 6px;
      background: #101820;
      white-space: nowrap;
    }

    .u13-project-flow span.active {
      border-color: #22d3ee;
      color: #d9fbff;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
    }

    .u13-project-flow b {
      color: #4f7183;
    }

    @media (max-width: 650px) {
      .u13-project-flow {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 1100px) {
      body {
        flex-direction: column !important;
      }

      #sim-left-panel {
        width: 100% !important;
        height: 57% !important;
        min-height: 0 !important;
        border-right: 0 !important;
        border-bottom: 1px solid var(--border) !important;
      }

      #sim-resizer {
        display: none !important;
      }

      .sim-challenge-card {
        flex: 0 0 auto !important;
      }

      #sim-right-panel {
        flex: 1 1 auto !important;
        width: 100% !important;
        height: 43% !important;
        min-width: 0 !important;
        min-height: 300px !important;
      }

      #sim-right-panel #sim-scene-container {
        flex: 1 1 auto !important;
        width: calc(100% - 16px) !important;
        min-height: 250px !important;
        margin: 8px !important;
        aspect-ratio: auto !important;
      }

      .sim-gamepad-card {
        width: min(310px, calc(100vw - 16px)) !important;
        right: 8px !important;
        bottom: 8px !important;
      }

      .u13-project-flow {
        bottom: 52px;
      }
    }
  </style>
</head>
<body></body>
</html>
